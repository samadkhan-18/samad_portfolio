<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            border: 1px solid whitesmoke;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;


        }
        .header1{
            border: 1px solid black;
            width: 300px;
            height: 80px;
            background-color:rgb(33, 33, 80);
        }
        .header2{
            border: 1px solid whitesmoke;
            width: 100%;
            height: 80px;
            background-color:white;
            display: flex;
            justify-content: flex-end;
            padding-right: 50px;
            align-items: center;
            flex :1
            }
            .header2 h4{
                margin: 0;
                font-weight:500;
                
            }
            .header2 img{
                height: 50px;
                border-radius: 50px;
                margin-right: 15px;
            }
            .admin-arrow{
                display: inline-block;
                transform: rotate(90deg);
                margin: 5px;
                font-size: 20px;
                cursor: pointer;

            }
        .body{
            border: 1px solid whitesmoke;
            width: 100%;
            height: 800px;
            background-color: aliceblue;
        }
        .sidebar{
            height: 800px;
            width: 300px;
            border: 1px solid rgba(212, 203, 203, 0.796);
            padding-top: 20px;
            background-color: rgb(254, 254, 254);
            
        }
        .sidebar-item{
            display: flex;
            text-decoration: none;
            margin: 60px 25px;
            align-items:center ;
            font-weight: 500;
            transition:  background 0.3s;
            color: black;
            height: 50px;
            
        }
        #fix{
            background-color: aqua;
            transform: scale(1.1);    
           }
        .sidebar-item:hover{
            background-color: aqua;
            transform: scale(1.1);
        }
        

        .arrow{
            margin-left: 35px;
        }
        .icon{
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      margin: 5px;
      color: white;
        }
    .d{
        background-color: aqua;
    }
    .u{
        background-color: blue;
    }
    .da{
        background-color: yellowgreen;
    }
    .g{
        background-color: violet;
    }





    </style>
</head>
<body>

   <div class="header">
    <div class="header1"></div>
    <div class="header2">
        <img src="dash.webp" alt="">
        <h4>ADMIN</h4>
        <span class="admin-arrow">></span>
    </div>

   </div> 
   
   <div class="body">
    <div class="sidebar">
        <a href="#" class="sidebar-item " id="fix">
            <div class="icon d">👀</div>
            DASHBOARD
        </a>
        <a href="#" class="sidebar-item">
            <div class="icon u">😁</div>
            USER MANAGEMENT
            <span class="arrow">></span>
        </a>
        <a href="#" class="sidebar-item">
            <div class="icon da">😴</div>
            DATA MANAGEMENT
            <span class="arrow">></span>
        </a>
        <a href="#" class="sidebar-item">
            <div class="icon g" >😾</div>
           GRAPH ANALYSIS
           <span class="arrow">></span>
        </a>

    </div>
    <div class="bodyr">

    </div>


   </div>
    
</body>
</html>
