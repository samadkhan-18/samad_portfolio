<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .header {
      background-color: black;
      height: 80px;
      width: 100%;
      display: flex;
      border: 1px solid black;
    }

    .heading {
      color: white;
      font-size: 15px;
      font-style: italic;
      align-items: center;
      padding-left: 20px;
      height: 80px;
      width: 70%;
      border: 1px solid black;
      display: flex;
    }

    .navi {
      height: 80px;
      width: 40%;
      display: flex;
      align-items: center;
      margin: 20 30px;
    }

    link {
      height: 40px;
      width: 40%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .list {
      display: flex;
      justify-self: space-around;
      height: 40px;
      width: 98%;
    }

    ul li a {
      text-decoration: none;
    }

    ul li {
      list-style: none;
      font-style: italic;
      align-items: center;
      margin: 0 20px;
      margin-block-start: 0.4em;
      font-size: 20px;
      padding: 2px 8px;
      border: 1px solid whitesmoke;
      border-radius: 8px;
    }

    ul li:hover {
      background-color: transparent;
      transform: scale(1.1);
      cursor: pointer;
      transition: 0.3s;
    }

    #logout {
      background-color: orangered;
    }

    .body {
      height: 500px;
      width: 100%;
      border: 1px solid black;
    }

    .img {
      height: 50px;
      width: 50px;
    }

    .box {
      margin-top: 150px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 150px auto 0 auto;
      width: 400px;
      padding: 30px;
      margin-left: auto;
      margin-right: auto;
      background-color: black;
      border-radius: 20px;
    }

    label {
      font-size: 18px;
      margin-top: 30px;
      margin-left: 30px;
      align-self: flex-start;
    }

    input {
      height: 40px;
      width: 340px;
      margin-left: 30px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid black;
    }

    #button {
      width: 90px;
      height: 40px;
      margin-left: 150px;
      margin-top: 30px;
    }

    input[type="submit"] {
      background-color: rebeccapurple;
      border-radius: 10px;
      padding: auto;
      cursor: pointer;
      border: none;
    }

    input[type="submit"]:hover {
      background-color: blueviolet;
    }

    input[placeholder="Enter URL"] {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="heading">
      <h1>Malicious URL Scanner. </h1>
    </div>
    <div class="navi">
      <div class="link">
        <ul class="list">
          <li><a href="index.html" style="color: whitesmoke;">Dashboard</a></li>
          <li><a href="admin.html" style="color: whitesmoke;">Myprofile</a></li>
          <li><a href="user.html" style="color: whitesmoke;">URL</a></li>
          <li id="logout"><a href="#" style="color: whitesmoke;">Logout</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="img">
      <img src="url.webp" alt="" height="1000">
    </div>

    <div class="box">
      <form action="URL">
        <label for="url-input">Enter URL:</label>
        <input type="text" id="url-input" >
        <input type="submit" value="SUBMIT" id="button">
      </form>
    </div>
  </div>
</body>
</html>
